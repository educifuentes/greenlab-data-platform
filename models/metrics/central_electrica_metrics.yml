metrics:
  - name: "Energía Total Generada"
    group_name: "Generación Eléctrica"
    description: "Suma total de la generación de energía para todas las horas (hora_1 hasta hora_24)."
    calculation: "Suma de hora_1 hasta hora_24"
    unidad: "MWh"

  - name: "Generación Renovable (ERNC)"
    group_name: "Generación Eléctrica"
    description: "Energía generada exclusivamente por aquellas fuentes definidas como ERNC (Energía Renovable No Convencional)."
    calculation: "Suma de hora_1 hasta hora_24 filtrado por energia_tipo = 'ERNC'"
    unidad: "MWh"

  - name: "Plantas en Operación"
    group_name: "Generación Eléctrica"
    description: "Cantidad de centrales únicas reportando generación en el periodo evaluado."
    calculation: "Conteo único de llave_nombre"
    unidad: "cantidad"

  - name: "Aporte por Tipo de Fuente"
    group_name: "Generación Eléctrica"
    description: "Cantidad de energía agrupada por fuente (Solar, Eólica, Térmica, etc.)."
    calculation: "Suma de la generación total agrupada por fuente_tipo"
    unidad: "MWh"

  - name: "Factor de Capacidad"
    group_name: "Eficiencia de Planta"
    description: "Relación entre la generación real y la que habría producido operando a máxima capacidad."
    calculation: "Promedio de (Energía Generada / Capacidad Máxima Instalada)"
    unidad: "%"

  - name: "Horas de Inactividad Promedio"
    group_name: "Eficiencia de Planta"
    description: "Promedio de horas donde la planta no reportó generación (hora_X = 0 o null)."
    calculation: "Conteo de horas inactivas por planta"
    unidad: "horas"
